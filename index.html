<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Círculo</title>
<meta name="description" content="Portal de socios y voluntarios del Círculo Chileno de Amigos del Camino de Santiago de Compostela">
<meta name="theme-color" content="#0B1A33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Círculo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin:0; height:100%; background:#0B1A33; overflow:hidden; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; }
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:radial-gradient(120% 90% at 100% 0%, #24457A 0%, #14284B 45%, #0B1A33 100%); color:#E2C58A; font:600 13px/1 -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing:.2em; transition:opacity .4s; z-index:2; }
  #splash img { width:120px; height:120px; border-radius:28px; }
</style>
</head>
<body>
<div id="splash"><img src="icon-512.png" alt=""><div>MI CÍRCULO</div></div>
<iframe id="f" title="Mi Círculo" allow="clipboard-write"></iframe>
<script>
  // URL de la app de Apps Script (implementación pública del portal)
  const PORTAL = 'https://script.google.com/macros/s/AKfycbzRN8CzRsDlYz0x_dTEMTx_jD82NFPZrwUoSrIvdIS01dlc_6IpDtami8Rl69NbjzukqQ/exec?p=socio';
  const f = document.getElementById('f');
  f.onload = () => { const s = document.getElementById('splash'); s.style.opacity = 0; setTimeout(() => s.remove(), 400); };
  f.src = PORTAL;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
